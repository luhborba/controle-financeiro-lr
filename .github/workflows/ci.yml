name: Testes Automatizados

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Cache dependências
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
      
      - name: Instalar dependências
        run: poetry install --no-interaction
      
      - name: Executar testes
        env:
          # Variáveis de ambiente para o CI
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          SECRET_KEY: test-secret-key-for-ci-only-not-for-production
          DEBUG: False
          ALLOWED_HOSTS: localhost,127.0.0.1
          LANGUAGE_CODE: pt-br
          TIME_ZONE: America/Sao_Paulo
        run: |
          poetry run pytest --cov=apps --cov-report=term-missing --cov-fail-under=70
      
      - name: Verificar cobertura
        run: echo "✅ Testes passaram com cobertura >= 70%"

