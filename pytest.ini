[pytest]
DJANGO_SETTINGS_MODULE = financeiro.settings
python_files = tests.py test_*.py *_test.py
python_classes = *TestCase Test*
python_functions = test_*
testpaths = apps
addopts = 
    --cov=apps
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=70
    --verbose
    --reuse-db
    --nomigrations

